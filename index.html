<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bản dùng thử</title>
<style>
  :root { --bg: #f6f7f5; --ink: #1d2320; --muted: #5d6862; --accent: #1f6f5c; --line: #dde2de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121614; --ink: #e6ebe8; --muted: #9aa69f; --accent: #5cc4a6; --line: #2c3430; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; display: grid; gap: 14px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--muted); }
  .spin { width: 28px; height: 28px; margin: 0 auto; border: 3px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: var(--accent); color: #fff;
          text-decoration: none; font-weight: 600; }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin" aria-hidden="true"></div>
  <h1 id="title">Đang mở bản dùng thử…</h1>
  <p id="msg">Vui lòng chờ vài giây.</p>
  <p id="go" hidden><a class="btn" id="btn" href="#">Mở bản dùng thử</a></p>
</main>
<script>
(function () {
  var REPO = "phucbrickai/pa-demo";
  var title = document.getElementById("title"), msg = document.getElementById("msg");
  var go = document.getElementById("go"), btn = document.getElementById("btn"), spin = document.getElementById("spin");

  function down() {
    spin.hidden = true;
    title.textContent = "Bản dùng thử đang tạm dừng";
    msg.textContent = "Máy chủ đang khởi động lại. Bạn vui lòng thử lại sau ít phút bằng chính đường link này.";
  }
  function open(url) {
    btn.href = url;
    go.hidden = false;
    window.location.replace(url);
  }
  function fromApi() {
    // Read the newest link straight from the repository, so a new link works within seconds.
    return fetch("https://api.github.com/repos/" + REPO + "/contents/link.json?ref=main&t=" + Date.now(),
                 { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function fromPages() {
    return fetch("link.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  fromApi().catch(fromPages).then(function (d) {
    if (d && d.url && /^https:\/\//.test(d.url) && d.status !== "down") open(d.url); else down();
  }).catch(down);
})();
</script>
</body>
</html>
